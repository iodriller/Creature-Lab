name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        # All test-exercised extras. The `llm` extra (litellm) is intentionally
        # excluded: the online `ask` path needs an API key and is not run in CI,
        # while the offline agent path and the LLM response parser need no provider.
        run: >
          uv sync --extra dev --extra sim --extra viz --extra export
          --extra evolve --extra mujoco
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      - name: CLI smoke (doctor + validate --task)
        run: |
          uv run creature-lab doctor
          uv run creature-lab validate examples/tripod.json --task examples/crawl_forward.json
      - name: Build wheel and smoke-test it from a clean install
        # Packaged zoo data (creatures/tasks/baselines) must work from an installed wheel,
        # outside the checkout — not just "uv run" against the source tree. Regressed
        # silently once before (a renamed package directory broke the build entirely).
        run: |
          rm -rf dist
          uv build
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet "$(ls dist/*.whl)[sim]"
          mkdir -p /tmp/wheel-smoke
          cd /tmp/wheel-smoke
          /tmp/wheel-venv/bin/creature-lab doctor
          /tmp/wheel-venv/bin/creature-lab zoo run quadruped --task crawl_forward --runs-dir ./runs
