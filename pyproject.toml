[project]
name = "creature-lab"
version = "0.1.0"
description = "Tiny local lab for designing, running, diagnosing, and improving modular robot-creatures from JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
sim = [
    "pybullet>=3.2.6",
    "numpy>=1.26",  # pybullet imports numpy at runtime but does not pin it
]
viz = [
    "viser>=1.0",
    "trimesh>=4.0",  # true capsule meshes in the viewer
    "numpy>=1.26",  # mesh vertex colors
    "matplotlib>=3.8",  # `plot` metric charts
]
export = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",  # enables MP4 output
    "pillow>=10.0",  # enables GIF output
]
llm = [
    "litellm>=1.0",  # provider abstraction for `creature-lab ask` (online mode)
]
evolve = [
    "cmaes>=0.10",  # CMA-ES strategy for `creature-lab evolve --strategy cmaes`
]
mujoco = [
    "mujoco>=3.0",  # MuJoCo backend + MJCF export round-trip (`run --backend mujoco`)
]

[project.scripts]
creature-lab = "creature_lab.cli:app"

[project.urls]
Homepage = "https://github.com/iodriller/Creature-Lab"
Repository = "https://github.com/iodriller/Creature-Lab"
Issues = "https://github.com/iodriller/Creature-Lab/issues"
Documentation = "https://github.com/iodriller/Creature-Lab/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creature_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
