[project]
name = "creature-lab"
version = "0.1.0"
description = "Minimal, visual, backend-agnostic creature simulation lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
sim = [
    "pybullet>=3.2.6",
    "numpy>=1.26",  # pybullet imports numpy at runtime but does not pin it
]
viz = [
    "viser>=1.0",
]
export = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",  # enables MP4 output
    "pillow>=10.0",  # enables GIF output
]
llm = [
    "litellm>=1.0",  # provider abstraction for `creature-lab ask` (online mode)
]

[project.scripts]
creature-lab = "creature_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creature_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
